services:
  securehub-db:
    image: postgres:18.6-alpine
    container_name: securehub_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - backups-data:/var/backups
      - ./base_datos/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - securehub_lan
    restart: unless-stopped

  securehub-redis:
    image: redis:7-alpine
    container_name: securehub_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - securehub_lan
    restart: unless-stopped

  securehub-files:
    image: nginx:alpine
    container_name: securehub_files
    volumes:
      - files-data:/usr/share/nginx/html/evidencias
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - securehub_lan
    restart: unless-stopped

  securehub-scanner:
    build: ./scanner
    container_name: securehub_scanner
    environment:
      API_URL: http://securehub-api:3000
    volumes:
      - logs-data:/var/logs/scanner
    networks:
      - securehub_lan
    restart: unless-stopped

  securehub-api:
    build: ./backend
    container_name: securehub_api
    environment:
      DB_HOST: securehub-db
      DB_NAME: ${DB_NAME}          # <- Inyección explícita
      DB_USER: ${DB_USER}          # <- Inyección explícita
      DB_PASSWORD: ${DB_PASSWORD}  # <- Inyección explícita
      JWT_SECRET: ${JWT_SECRET}    # <- Inyección explícita
      REDIS_HOST: securehub-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FILE_SERVER_URL: http://securehub-files
    depends_on:
      - securehub-db
      - securehub-redis
    volumes:
      - logs-data:/app/logs
      - ./backend/src:/app/src
    networks:
      - securehub_lan
    ports:
      - "3000:3000"
    restart: unless-stopped

  securehub-frontend:
    build: ./frontend
    container_name: securehub_frontend
    depends_on:
      - securehub-api
    networks:
      - securehub_lan
    ports:
      - "80:80"
    restart: unless-stopped

networks:
  securehub_lan:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  files-data:
  logs-data:
  backups-data: