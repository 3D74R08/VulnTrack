worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # 1. Ocultar la versión del servidor en las cabeceras HTTP
    server_tokens off;

    server {
        listen       80;
        server_name  localhost;

        # 2. Raíz donde mapeamos el volumen files-data
        root   /usr/share/nginx/html/evidencias;

        # 3. Bloquear estrictamente el listado de directorios
        autoindex off;

        # 4. Restringir métodos HTTP: Solo lectura para este contenedor estático
        if ($request_method !~ ^(GET|HEAD)$ ) {
            return 405;
        }

        location / {
            # Evitar Path Traversal: Asegurar que el archivo exista o devolver 404
            try_files $uri $uri/ =404;
        }
    }
}
